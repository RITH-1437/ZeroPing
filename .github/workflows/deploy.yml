name: Deploy ZeroPing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" -p ${{ secrets.EC2_PORT || '22' }} bash -s << 'EOF'
            echo "🚀 Starting deployment..."
            ~/scripts/deploy.sh
            echo "📦 Checking containers..."
            docker compose -f ~/ZeroPing/docker-compose.yml ps
            echo "❤️ Checking application..."
            curl --fail --silent --show-error http://localhost/up
            echo "✅ Deployment completed successfully."
EOF
